spring:
  application:
    name: support-agent
  # Default profile for local runs; override with SPRING_PROFILES_ACTIVE=anthropic
  profiles:
    active: ollama

  # ── PostgreSQL ───────────────────────────────────────────────
  datasource:
    url: jdbc:postgresql://localhost:5432/supportdb
    username: support_user
    password: support_pass
    driver-class-name: org.postgresql.Driver

  # ── JPA ──────────────────────────────────────────────────────
  # Flyway owns DDL — Hibernate only validates
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  # ── Flyway ───────────────────────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8080

# ── Anthropic Claude ─────────────────────────────────────────
# Base defaults (used when no anthropic/ollama profile is active, e.g. tests).
# Profile-specific overrides live in the documents below.
anthropic:
  api-url: http://localhost:11434/v1/messages
  api:
    key: ollama
  model: glm-5:cloud
  max-tokens: 1024

# ── Agent ────────────────────────────────────────────────────
agent:
  max-iterations: 6

# ── Actuator / Metrics ───────────────────────────────────────
# Prometheus scrapes http://localhost:8080/actuator/prometheus
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    prometheus:
      access: read_only
  prometheus:
    metrics:
      export:
        enabled: true
  # tag every metric with the app name so Grafana can filter by service
  metrics:
    tags:
      application: ${spring.application.name}
  observations:
    http:
      server:
        requests:
          enabled: true

# ═════════════════════════════════════════════════════════════
# Profile: ollama — local testing against an Ollama-hosted model
# ═════════════════════════════════════════════════════════════
---
spring:
  config:
    activate:
      on-profile: ollama

anthropic:
  api-url: http://localhost:11434/v1/messages
  api:
    key: ollama
  model: glm-5:cloud
  max-tokens: 1024

# ═════════════════════════════════════════════════════════════
# Profile: anthropic — real Anthropic Messages API
# API key is read from the ANTHROPIC_API_KEY environment variable
# ═════════════════════════════════════════════════════════════
---
spring:
  config:
    activate:
      on-profile: anthropic

anthropic:
  api-url: https://api.anthropic.com/v1/messages
  api:
    key: ${ANTHROPIC_API_KEY}
  model: claude-sonnet-4-6
  max-tokens: 1024
