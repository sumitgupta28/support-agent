global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'support-agent-backend'
    metrics_path: '/actuator/prometheus'
    static_configs:
      # The backend runs via `./gradlew bootRun` on the macOS host, not in Docker,
      # so Prometheus reaches it through Docker Desktop's host.docker.internal.
      - targets: ['host.docker.internal:8080']
        labels:
          application: 'support-agent'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
